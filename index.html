<!doctype html>
<!--
Name: Nicole Carter
Date: March 4th, 2026
Description: Fruit Memory Card Game
Objective: Click the cards to flip them over and try to 
match all the cards in the least amount of moves.
-->
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
</head>

<body>
    <div id="splashScreen">
        <canvas id="splashCanvas" width="480" height="1200"></canvas>
        <button id="startButton" style="display:none;">Start</button>
    </div>

    <div id="startScreen" style="display:none;">
        <img src="images/startScreen.png" id="startImg">
        <button id="startGameButton">Start</button>
    </div>

    <div id="gameScreen" style="display: none;">
        <div id="topBar">
            <button id="helpButton"> Help </button>
            <img src="images/peach.png" id="peach" width="50" height="50">
        </div>
        <header> 
            <h1>Fruit Flip Memory Game! </h1>
        </header>
        <h2>Moves: <span id="moves">0</span></h2>
        <div id="helpPopup" style="display:none;">
            <div id="helpContent">
                <span id="closeHelp">X</span>
                <h2>How to Play</h2>
                <p>Click two cards to flip them over. If they match, they disappear. 
                Try to match all 8 pairs with the fewest moves possible!</p>
            </div>
        </div>

        <div id="cardContainer">

            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
            <div class="card">
                <img src="images/backCard.png" class="backCard">
            </div>
        </div> 
    </div>

    <div id="endScreen" style="display:none;">
        <div class="endScreenContent">
                <h2>Game Complete!</h2>

                <p>Your Moves: <span id="finalMoves">0</span></p>
                <p>Best Score: <span id="bestMoves">0</span></p>

                <div id="playAgain">Play Again</div>
        </div>
    </div>
</body>

</html>
